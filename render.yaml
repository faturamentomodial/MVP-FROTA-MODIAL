services:
  - type: web
    name: modial-frota
    runtime: docker
    repo: https://github.com/faturamentomodial/MVP-FROTA-MODIAL
    branch: main
    region: virginia
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: fotos-frota
      mountPath: /data/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: modial-frota-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: CORS_ORIGINS
        value: ""

databases:
  - name: modial-frota-db
    region: virginia
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "16"
    databaseName: fleet
    user: fleet
    ipAllowList: []
