services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fleet:${POSTGRES_PASSWORD:-fleet}@db:5432/fleet
      SECRET_KEY: ${SECRET_KEY:-development-secret-change-before-production-123}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSITRON_LOGIN: ${POSITRON_LOGIN:-}
      POSITRON_PASSWORD: ${POSITRON_PASSWORD:-}
      ROUTES_GEOCODER_URL: ${ROUTES_GEOCODER_URL:-}
      ROUTES_ROUTER_URL: ${ROUTES_ROUTER_URL:-}
      ROUTES_TIMEOUT_SECONDS: ${ROUTES_TIMEOUT_SECONDS:-15}
      ROUTES_MIN_INTERVAL_SECONDS: ${ROUTES_MIN_INTERVAL_SECONDS:-1}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
