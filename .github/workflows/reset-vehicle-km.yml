name: Zerar KM dos veiculos
on:
  workflow_dispatch:
    inputs:
      clean_operations:
        description: Apagar viagens, checklists e ocorrencias antes de zerar KM
        type: boolean
        default: false
      clean_plans:
        description: Apagar planejamentos salvos e suas versoes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: oracle-production
  cancel-in-progress: false
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Back up database before cleanup
        if: inputs.clean_operations || inputs.clean_plans
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/modial-frota
          set -a
          . ./.release.env
          set +a
          umask 077
          mkdir -p backups
          backup="backups/before-cleanup-$(date -u +%Y%m%dT%H%M%SZ).sql"
          sudo env APP_IMAGE="$APP_IMAGE" docker compose -f docker-compose.oracle.yml exec -T db pg_dump -U fleet -d fleet > "$backup"
          test -s "$backup"
          echo "Backup saved: $backup"
          REMOTE
      - name: Reset and verify current vehicle KM
        env:
          CLEAN_OPERATIONS: ${{ inputs.clean_operations }}
          CLEAN_PLANS: ${{ inputs.clean_plans }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$ORACLE_USER@$ORACLE_HOST" 'cd ~/modial-frota && set -a && . ./.release.env && set +a && sudo env APP_IMAGE="$APP_IMAGE" docker compose -f docker-compose.oracle.yml exec -T app python - '"$CLEAN_OPERATIONS $CLEAN_PLANS" <<'PY'
          import json
          import sys
          from sqlalchemy import select, func, delete, text
          from app.core.database import SessionLocal
          from app.models import Vehicle, Trip, TripInvoice, Checklist, ChecklistAnswer, Occurrence
          from app.models.route_plans import RoutePlan, RoutePlanVersion
          from app.models.enums import VehicleStatus
          from app.services.audit import audit

          with SessionLocal() as db:
              removed = {}
              clean_plans = sys.argv[2].lower() == 'true'
              reset_km = not clean_plans or sys.argv[1].lower() == 'true'
              if clean_plans:
                  db.execute(text('LOCK TABLE route_plans, route_plan_versions IN ACCESS EXCLUSIVE MODE'))
                  for model in (RoutePlanVersion, RoutePlan):
                      removed[model.__tablename__] = db.scalar(select(func.count()).select_from(model))
                      db.execute(delete(model))
                      if db.scalar(select(func.count()).select_from(model)):
                          raise RuntimeError('Planning cleanup verification failed; rolling back')
                  audit(db, None, 'LIMPAR_PLANEJAMENTOS', 'SYSTEM', None, {'removed': dict(removed), 'source': 'manual_maintenance'})
              if sys.argv[1].lower() == 'true':
                  db.execute(text('LOCK TABLE vehicles, trips, trip_invoices, checklists, checklist_answers, occurrences IN ACCESS EXCLUSIVE MODE'))
                  for model in (Occurrence, ChecklistAnswer, Checklist, TripInvoice, Trip):
                      removed[model.__tablename__] = db.scalar(select(func.count()).select_from(model))
                      db.execute(delete(model))
                  for model in (Occurrence, ChecklistAnswer, Checklist, TripInvoice, Trip):
                      if db.scalar(select(func.count()).select_from(model)):
                          raise RuntimeError('Cleanup verification failed; rolling back')
                  audit(db, None, 'LIMPAR_OPERACAO', 'SYSTEM', None, {'removed': removed, 'source': 'manual_maintenance'})
              vehicles = list(db.scalars(select(Vehicle).order_by(Vehicle.id).with_for_update()))
              changed = 0
              for vehicle in vehicles:
                  if sys.argv[1].lower() == 'true' and vehicle.status == VehicleStatus.EM_VIAGEM:
                      vehicle.status = VehicleStatus.DISPONIVEL if vehicle.ativo else VehicleStatus.INATIVO
                  previous = vehicle.km_atual
                  if reset_km and previous != 0:
                      audit(db, None, 'ZERAR_KM', 'VEHICLE', vehicle.id,
                            {'placa': vehicle.placa, 'km_anterior': previous, 'km_atual': 0,
                             'source': 'manual_maintenance'})
                      vehicle.km_atual = 0
                      changed += 1
              db.flush()
              remaining = db.scalar(select(func.count()).select_from(Vehicle).where(Vehicle.km_atual != 0))
              if reset_km and remaining:
                  raise RuntimeError('Verificacao falhou; transacao sera revertida.')
              db.commit()
              print(json.dumps({'vehicles_total': len(vehicles), 'vehicles_reset': changed,
                                'nonzero_remaining': remaining, 'audit_saved': True, 'removed': removed}))
          PY
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
