name: modial-frota
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  app:
    image: ${APP_IMAGE:?Configure APP_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://fleet:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@db:5432/fleet
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:?Configure CORS_ORIGINS}
    ports:
      - "80:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 60s
      retries: 12
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres_data:
