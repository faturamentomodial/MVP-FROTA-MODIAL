name: modial-frota
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  app:
    image: ${APP_IMAGE:?Configure APP_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://fleet:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@db:5432/fleet
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY}
      ENVIRONMENT: production
      SANKHYA_BASE_URL: ${SANKHYA_BASE_URL:-https://api.sankhya.com.br}
      SANKHYA_CLIENT_ID: ${SANKHYA_CLIENT_ID:-}
      SANKHYA_CLIENT_SECRET: ${SANKHYA_CLIENT_SECRET:-}
      SANKHYA_TOKEN: ${SANKHYA_TOKEN:-}
      POSITRON_LOGIN: ${POSITRON_LOGIN:-}
      POSITRON_PASSWORD: ${POSITRON_PASSWORD:-}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      ROUTES_ROUTER_PROVIDER: ${ROUTES_ROUTER_PROVIDER:-geoapify}
      ROUTES_GEOCODER_PROVIDER: ${ROUTES_GEOCODER_PROVIDER:-geoapify}
      ROUTES_GEOCODER_URL: ${ROUTES_GEOCODER_URL:-https://nominatim.openstreetmap.org}
      ROUTES_ROUTER_URL: ${ROUTES_ROUTER_URL:-}
      ROUTES_TIMEOUT_SECONDS: ${ROUTES_TIMEOUT_SECONDS:-15}
      ROUTES_MIN_INTERVAL_SECONDS: ${ROUTES_MIN_INTERVAL_SECONDS:-1}
      CORS_ORIGINS: https://${HTTPS_DOMAIN:-modialfrotas.com.br}
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 60s
      retries: 12
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HTTPS_DOMAIN: ${HTTPS_DOMAIN:-modialfrotas.com.br}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
